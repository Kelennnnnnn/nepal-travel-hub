    row: { id: "5ecf0000-0000-0000-0000-000000000001" }
    select: [T2]
    insert_values: { review_id: "'5ece0000-0000-0000-0000-000000000001'", user_id: "'5ec10000-0000-0000-0000-000000000001'" }
    insert: []   # review_votes_insert_own's own CHECK (not is_own_review(review_id)) correctly rejects T1 voting on T1's own review -- the one role that'd otherwise pass auth.uid()=user_id. See H3-adjacent note: no OTHER role can insert here at all (own-review-only ownership, T2 already has the fixture vote).
    update: { set: "vote = 'unhelpful'" }
    update_allow: []
    delete: [T2]

  reviews:
    row: { id: "5ece0000-0000-0000-0000-000000000001" }
    select: [anon, T1, T2, OA, MA, SA, OB, OS, admin, admin_aal1, super_admin, support, finance]
    insert_values: { listing_id: "'5ec40000-0000-0000-0000-000000000001'", agency_id: "'5ec00000-0000-0000-0000-00000000000a'", booking_id: "'5ec90000-0000-0000-0000-000000000001'", traveler_id: "'5ec10000-0000-0000-0000-000000000001'", rating: "5", comment: "'A second probe review comment, long enough to pass the length guard.'" }
    insert: []   # the booking is already consumed by the fixture review itself -- a second insert against the same booking_id is a meaningful "only via a real completed booking, and only once" probe, not a false negative.
    update: { set: "comment = 'Updated comment, also long enough to pass the length guard.'" }
    update_allow: [T1, admin, super_admin]
    delete: [super_admin]   # reviews_admin_delete uses is_super_admin() specifically, not is_admin() -- a plain admin cannot hard-delete a review.

  season_templates:
    row: { id: "5eec0000-0000-0000-0000-000000000001" }
    select: [anon, T1, T2, OA, MA, SA, OB, OS, admin, admin_aal1, super_admin, support, finance]
