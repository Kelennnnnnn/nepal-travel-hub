# ============================================================================
# RLS + EXECUTE matrix — source of truth for the generated pgTAP suite in
# supabase/tests/security/generated/. Regenerate with `npm run test:db`
# (scripts/generate-security-tests.ts runs first and will FAIL THE BUILD —
# non-zero exit, no generated SQL written — if:
#   - any public.* base table has no entry under `tables:` below, or
#   - any SECURITY DEFINER function in public.* has no entry under
#     `functions:` below.
# This is the mechanism that makes "add a table/SECURITY DEFINER function
# without updating this file" fail CI, per the prompt's acceptance check.
#
# Fixture roster (see fixtures.sql for the full dataset this probes):
#   anon        — unauthenticated
#   T1          — traveler, owns the canonical booking/review/conversation
#   T2          — traveler, unrelated to every fixture row (the "foreign
#                 traveler" probe)
#   OA, MA, SA  — owner/manager/staff of Agency A (the canonical row-owner
#                 agency for every agency-scoped table below)
#   OB          — owner of Agency B (an unrelated, "foreign" agency)
#   OS          — owner of Agency S (suspended)
#   admin       — platform admin, aal2 (is_admin() true)
#   admin_aal1  — platform admin role, but aal1 session (is_admin() FALSE —
#                 this is AUTH-01/aal2-enforcement's own regression tripwire)
#   super_admin — aal2
#   support     — aal2 (is_support_or_admin() true, is_admin() false)
#   finance     — aal2 (is_finance_or_admin() true, is_admin() false)
#
# Every table entry's `row` names the exact fixture row (by primary key)
# every select/update/delete probe runs against. `insert` additionally
# needs `insert_values` (the literal column list for a fresh INSERT
# attempt) when any role is expected to be able to insert at all — tables
# where every role is denied omit it (the generator only needs a values
# clause when testing a path that might actually succeed; a denied INSERT
# is asserted via 0-rows/42501 on a minimal columns-only attempt the
# generator builds from `insert_values` regardless, so this key is
# REQUIRED on every table — see generator for the exact probe it runs).
#
# A role omitted from an operation's list is asserted DENIED for that
# operation. service_role is never listed — it bypasses RLS entirely
# (rolbypassrls=true) and is asserted allow-all separately, once, by the
# generator rather than repeated on every table.
# ============================================================================

