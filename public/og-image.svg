<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Mountain range silhouette -->
  <polygon points="0,420 180,220 320,340 480,160 640,300 760,180 900,280 1040,140 1200,260 1200,630 0,630" fill="#052e16" opacity="0.9"/>
  <polygon points="480,160 560,260 400,260" fill="white" opacity="0.9"/>
  <polygon points="480,160 510,200 450,200" fill="#dcfce7" opacity="0.95"/>

  <!-- Logo mark -->
  <rect x="72" y="72" width="64" height="64" rx="16" fill="#16a34a"/>
  <polygon points="104,86 128,122 80,122" fill="white"/>
  <polygon points="104,86 112,102 96,102" fill="#dcfce7"/>

  <!-- Brand name -->
  <text x="152" y="118" font-family="Georgia, serif" font-size="52" font-weight="700" fill="white" letter-spacing="-1">Into Nepal</text>

  <!-- Tagline -->
  <text x="72" y="200" font-family="Arial, sans-serif" font-size="28" fill="#86efac" letter-spacing="0.5">Book Treks, Tours &amp; Adventures in Nepal</text>

  <!-- Divider -->
  <rect x="72" y="230" width="120" height="3" rx="2" fill="#16a34a"/>

  <!-- Feature bullets -->
  <text x="72" y="310" font-family="Arial, sans-serif" font-size="22" fill="#bbf7d0">✓  Verified local agencies</text>
  <text x="72" y="355" font-family="Arial, sans-serif" font-size="22" fill="#bbf7d0">✓  Himalayan treks &amp; tours</text>
  <text x="72" y="400" font-family="Arial, sans-serif" font-size="22" fill="#bbf7d0">✓  Secure online booking</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#16a34a" opacity="0.85"/>
  <text x="600" y="615" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">nepal-travel-hub.onrender.com</text>
</svg>
